[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "defect-insight"
version = "0.1.0"
description = "Deterministic AI-assisted defect table analysis system"
readme = "README.md"
authors = [{ name = "AI Agent & Engineering Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
defect-insight = "defect_insight.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
